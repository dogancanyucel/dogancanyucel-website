<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <!-- The address carries a one-time code. Nothing on this page loads from anywhere else, and no link sends it on. -->
  <meta name="referrer" content="no-referrer" />
  <title>Turquoise</title>
  <!--
    Where Firebase's account mails land: setting a new password, confirming an address (owner, 2026-09-16: Firebase's own page
    showed the project's code, so nobody could tell the mail came from the app, and it had no way back to it).
    Firebase Console › Authentication › Templates › Customize action URL points here; Firebase adds mode, oobCode, apiKey, lang.
    The words are the app's own translations — scripts/auth-page-strings.mjs. The password rule is the app's — password-rules.js.
  -->
  <style>
    :root {
      --ground: #eef5f6; --surface: #ffffff; --text: #0d1f22; --secondary: #52676b; --line: #d5e3e5;
      --accent: #00acc1; --ink-on-accent: #00242b; --bad: #c62828; --good-wash: rgba(0, 172, 193, 0.14);
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ground: #0b1416; --surface: #122124; --text: #e8f6f7; --secondary: #9db3b7; --line: #23373b;
        --accent: #00e5ff; --ink-on-accent: #00242b; --bad: #ff8a80; --good-wash: rgba(0, 229, 255, 0.14);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--ground); color: var(--text);
      font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif;
      display: grid; place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }
    main { width: 100%; max-width: 400px; display: grid; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 10px; justify-content: center; font-weight: 700; font-size: 1.05rem; }
    .brand img { width: 36px; height: 36px; border-radius: 9px; }
    .card { background: var(--surface); border-radius: 16px; padding: 24px 20px; display: grid; gap: 16px; }
    h1 { margin: 0; font-size: 1.35rem; text-align: center; text-wrap: balance; }
    .who { margin: -8px 0 0; text-align: center; color: var(--secondary); font-size: 0.95rem; overflow-wrap: anywhere; }
    label { display: grid; gap: 6px; font-size: 0.9rem; color: var(--secondary); }
    input {
      font: inherit; color: var(--text); background: var(--ground); border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px; width: 100%;
    }
    input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .note { margin: 0; font-size: 0.9rem; color: var(--bad); min-height: 1.3em; }
    button, a.open {
      font: inherit; font-weight: 700; border: 0; border-radius: 12px; min-height: 50px; width: 100%;
      background: var(--accent); color: var(--ink-on-accent); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none;
    }
    button:disabled { background: var(--line); color: var(--secondary); cursor: default; }
    button:focus-visible, a.open:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
    a.open img { width: 26px; height: 26px; border-radius: 7px; }
    .result { text-align: center; display: grid; gap: 16px; justify-items: center; }
    .mark { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 34px; background: var(--good-wash); color: var(--accent); }
    .mark.refused { color: var(--bad); background: transparent; border: 2px solid var(--line); }
    .result p { margin: 0; text-wrap: balance; }
    .wait { text-align: center; color: var(--secondary); }
    @media (prefers-reduced-motion: no-preference) { .card { transition: opacity 120ms ease; } }
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="/assets/turquoise-ai-logo.svg" alt="" /><span>Turquoise</span></div>
    <section class="card" id="card" aria-live="polite">
      <p class="wait">…</p>
    </section>
  </main>
  <noscript><p style="text-align:center">JavaScript is needed to finish this.</p></noscript>
  <script type="module" src="./page.js"></script>
</body>
</html>
