<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Turquoise</title>
  <!--
    Where Firebase's "Continue" goes once a password has been reset (owner, 2026-09-16: after the new password is set there is
    no way back to the app). The app asks for this page in the reset mail's action settings.

    No words to translate: the reader has just been told, in their language, on Firebase's page, that the password changed.
    This page only opens the app — at once where it can, and from the button when the browser wants a tap first.
    iOS answers the app's own URL scheme; Android opens the app by package through an intent link.
  -->
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0b1416; color: #e8f6f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px; box-sizing: border-box;
    }
    main { display: grid; justify-items: center; gap: 28px; text-align: center; }
    .done {
      width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center;
      background: rgba(0, 188, 212, 0.16); color: #00bcd4; font-size: 40px; line-height: 1;
    }
    a.open {
      display: inline-flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 28px;
      border-radius: 16px; background: #00bcd4; color: #04191c; font-weight: 700; font-size: 1.15rem;
      text-decoration: none;
    }
    a.open:focus-visible { outline: 3px solid #e8f6f7; outline-offset: 3px; }
    a.open img { width: 32px; height: 32px; border-radius: 8px; }
  </style>
</head>
<body>
  <main>
    <div class="done" aria-hidden="true">✓</div>
    <a class="open" id="open" href="com.aistudio.fitai.trfity://password-changed">
      <img src="/assets/turquoise-ai-logo.svg" alt="" />
      <span>Turquoise</span>
      <span aria-hidden="true">↗</span>
    </a>
  </main>
  <script>
    (function () {
      var link = document.getElementById("open");
      if (/Android/i.test(navigator.userAgent)) {
        link.href = "intent://password-changed#Intent;scheme=com.aistudio.fitai.trfity;package=com.aistudio.fitai.trfity;end";
      }
      if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        window.location.href = link.href;
      }
    })();
  </script>
</body>
</html>
