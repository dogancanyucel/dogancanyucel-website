<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="D">
  <!-- A favicon is read at 16px. "DCY." fitted there gave three 4px letters that
       resolved into a smudge, so the mark is the initial alone, set as large as the
       tile allows (owner, 2026-09-26). The site's wordmark stays "DCY." in the nav.
       The letter is a path, not <text>: a favicon renders without the page's webfont,
       so type would fall back per platform and the mark would change shape. -->
