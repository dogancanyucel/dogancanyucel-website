  <g fill="#ffffff" transform="translate(15.2 13) scale(1.636)">
    <path d="M0 0h9.2C16.1 0 20.5 4.2 20.5 11S16.1 22 9.2 22H0V0zm8.9 17.2c3.9 0 6.2-2.3 6.2-6.2S12.8 4.8 8.9 4.8H5.3v12.4h3.6z"/>
